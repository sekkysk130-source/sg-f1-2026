name: check-official-times
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: commit
        run: |
          git config user.name "f1-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add official.json
          git diff --cached --quiet || (git commit -q -m "official times check" && git pull -q --rebase && git push -q)
